<script>
const DATA={"Doanh trại":[{"id":"doanh_trại_1","label":"1","q":"Theo Nghị định số 02/2026/NĐ-CP, định mức sử dụng nước sạch áp dụng cho địa bàn có nguồn nước sạch là","options":["140-160l/người/ngày","180-200l/người/ngày","200-220l/người/ngày","240-260l/người/ngày"],"answer":"C","section":"Doanh trại"},{"id":"doanh_trại_2","label":"2","q":"Theo Nghị định số 02/2026/NĐ-CP, một bộ dụng cụ sinh hoạt gồm:","options":["01 xô đựng, 01 chậu giặt, 01 chậu rửa mặt","02 xô đựng, 01 chậu giặt, 02 chậu rửa mặt","01 xô đựng, 02 chậu giặt, 02 chậu rửa mặt","02 xô đựng, 02 chậu giặt, 02 chậu rửa mặt"],"answer":"D","section":"Doanh trại"},{"id":"doanh_trại_3","label":"3","q":"Theo Nghị định số 02/2026/NĐ-CP, điện năng sử dụng cho đào tạo bao gồm:","options":["Bảo đảm cho hoạt động các thiết bị phục vụ đào tạo, nghiên cứu và huấn luyện đồng bộ trong phòng học, giảng đường, phòng thí nghiệm, phòng điều hành, thư viện, xưởng in, xưởng thực tập tại các học viện, nhà trường trong quân đội.","Bảo quản, bảo dưỡng, sữa chữa vũ khí, trang thiết bị phục vụ cho giảng dạy, học tập, nghiên cứu, luyện tập.","Cả A và B đều sai","Cả A và B"],"answer":"A","section":"Doanh trại"},{"id":"doanh_trại_4","label":"4","q":"Theo Nghị định số 02/2026/NĐ-CP, tiêu chuẩn diện tích ở đối với chỉ huy đại đội, trung đội và tương đương; sĩ quan giữ chức vụ có cấp bậc quân hàm là cấp úy","options":["12m2/người","24m2/người","15m2/người","18m2/người"],"answer":"A","section":"Doanh trại"},{"id":"doanh_trại_5","label":"5","q":"Theo Nghị định số 02/2026/NĐ-CP, trang bị máy điều hòa phòng làm việc được áp dụng từ cấp nào trở lên","options":["Cơ quan trung đoàn và tương đương trở lên","Chỉ huy tiểu đoàn, cơ quan trung đoàn và tương đương trở lên","Chỉ huy đại đội, cơ quan trung đoàn và tương đương trở lên","Cơ quan sư đoàn và tương đương trở lên"],"answer":"B","section":"Doanh trại"},{"id":"doanh_trại_6","label":"6","q":"Theo Nghị định số 02/2026/NĐ-CP, phòng họp, phòng giao ban từ cấp nào trở lên được trang bị máy điều hòa","options":["Đại đội trở lên","Tiểu đoàn và tương đương trở lên","Trung đoàn và tương đương trở lên","Sư đoàn và tương đương trở lên"],"answer":"B","section":"Doanh trại"},{"id":"doanh_trại_7","label":"7","q":"Theo Nghị định số 02/2026/NĐ-CP, định mức sử dụng điện năng sinh hoạt, làm việc hạ sĩ quan, binh sĩ, thiếu sinh quân, học sinh năng khiếu là bao nhiêu","options":["10kWh/người/tháng","12kWh/người/tháng","24kWh/người/tháng","20kWh/người/tháng"],"answer":"C","section":"Doanh trại"},{"id":"doanh_trại_8","label":"8","q":"Theo Nghị định số 02/2026/NĐ-CP, điện năng sử dụng cho sử dụng cho sinh hoạt và làm việc gồm","options":["Chiếu sáng; làm mát tại phòng ở, phòng làm việc, các công trình công cộng và một số công trình phụ trợ khác trong doanh trại phục vụ cho sinh hoạt và làm việc.","Sử dụng cho hoạt động của các thiết bị nghe nhìn: Tivi, radio, tăng âm, hệ thống âm thanh, thiết bị trình chiếu,…(được trang bị theo quy định của Bộ Quốc phòng về tiêu chuẩn đời sống văn hóa tinh thần) để phục vụ sinh hoạt chính trị, văn hóa, tinh thần các đối tượng.","Sử dụng cho hoạt động của các máy móc, thiết bị vặn phòng được trang bị theo quy định phục vụ làm việc","Cả 3 đáp án trên"],"answer":"D","section":"Doanh trại"},{"id":"doanh_trại_9","label":"9","q":"Theo Quy định số 442/QyĐ-CĐHC của Trường Cao đẳng Hậu cần 1 về Quản lý, sử dụng tiết kiệm điện, nước hành vi đun, nấu, tự ý câu móc điện, nước khi chưa có ý kiến của cơ quan chức năng và Thủ trưởng Nhà trường có bị nghiêm cấm không?","options":["Không bị nghiêm cấm","Bị nghiêm cấm","Chỉ cấm khi bị phát hiện","Không bị nghiêm cấm nếu đảm bảo an toàn"],"answer":"B","section":"Doanh trại"},{"id":"doanh_trại_10","label":"10","q":"Theo Quy định số 442/QyĐ-CĐHC của Trường Cao đẳng Hậu cần 1 về Quản lý, sử dụng tiết kiệm điện, nước; đối với khu nhà ở học viên, hành vi nào sau đây bị nghiêm cấm","options":["Tự ý đun, nấu tại các phòng ở","Sử dụng các thiết bị sai quy định, công suất tiêu thụ lớn có nguy cơ mất an toàn như: Thiết bị sưởi, bàn là, sục đun nước,…","Tự ý câu móc điện, nước mà chưa được sự đồng ý của cơ quan chức năng và Thủ trưởng Nhà trường","Cả 3 đáp án trên"],"answer":"D","section":"Doanh trại"},{"id":"doanh_trại_11","label":"11","q":"Theo Nghị định số 02/2026/NĐ-CP, tiêu chuẩn diện tích làm việc đối với sĩ quan không giữ chức vụ","options":["15m2/người","13-15m2/người","08-12m2/người","15-17m2/người"],"answer":"C","section":"Doanh trại"},{"id":"doanh_trại_12","label":"12","q":"Theo Nghị định số 02/2026/NĐ-CP, tiêu chuẩn doanh cụ sử dụng trong nhà ở đối với hạ sĩ quan, binh sĩ, thiếu sinh quân, học sinh năng khiếu","options":["01 giường","01 giường, 01 ghế tựa","01 giường, 02 ghế tựa","02 giường"],"answer":"A","section":"Doanh trại"},{"id":"doanh_trại_13","label":"13","q":"Theo Nghị định số 02/2026/NĐ-CP, tiêu chuẩn doanh cụ sử dụng trong nhà ở đối với cấp úy không giữ chức vụ","options":["01 giường, 01 bộ bàn ghế uống nước/2 người","01 giường, 01 bộ bàn ghế uống nước/4 người","01 giường, 01 bộ bàn ghế uống nước/3 người","01 giường, 01 bộ bàn ghế uống nước/5 người"],"answer":"C","section":"Doanh trại"},{"id":"doanh_trại_14","label":"14","q":"Theo Nghị định số 02/2026/NĐ-CP, tiêu chuẩn doanh cụ sử dụng trong nhà ở đối với chỉ huy đại đội, trung đội và tương đương; sĩ quan giữ chức vụ có cấp bậc quân hàm là cấp úy","options":["01 giường, 01 bộ bàn ghế uống nước","01 giường, 02 bộ bàn ghế uống nước, 01 tủ áo","01 giường, 01 bộ bàn ghế uống nước, 02 tủ áo","01 giường, 01 bộ bàn ghế uống nước, 01 tủ áo"],"answer":"D","section":"Doanh trại"},{"id":"doanh_trại_15","label":"15","q":"Theo Nghị định số 02/2026/NĐ-CP, tiêu chuẩn doanh cụ sử dụng trong nhà ở đối với chỉ huy tiểu đoàn và tương đương; sĩ quan giữ chức vụ có cấp bậc quân hàm cao nhất là Trung tá, thiếu tá","options":["01 giường, 01 bộ bàn ghế uống nước","01 giường, 02 bộ bàn ghế uống nước, 01 tủ áo","01 giường, 01 bộ bàn ghế uống nước, 01 tủ áo","01 giường, 01 bộ bàn ghế uống nước, 02 tủ áo"],"answer":"C","section":"Doanh ol bù điện giải.","Đắp chăn dày để giữ ấm cơ thể."],"answer":"D","section":"Quân y"},{"id":"quân_y_10","label":"10","q":"Để phòng, chống say nắng, say nóng cho chiến sĩ (đặc biệt là chiến sĩ mới) trong mùa huấn luyện, chỉ huy đơn vị cần làm gì?","options":["Tổ chức luyện tập cường độ cao ngay từ ngày đầu tiên dưới trời nắng gắt","Điều chỉnh thời gian huấn luyện linh hoạt, tránh giờ nắng nóng cao điểm và cho bộ đội nghỉ ngơi hợp lý","Cấm quân nhân uống nước trong giờ giải lao trên thao trường","Đóng kín cửa phòng ở để tránh hơi nóng ngoài trời lùa vào"],"answer":"B","section":"Quân y"}]};
const LETTERS='ABCDE';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SECTION_MAP={
  doanh:{name:'Doanh trại',key:'Doanh trại',icon:'🏢'},
  nhu:{name:'Quân nhu',key:'Quân nhu',icon:'🍚'},
  y:{name:'Quân y',key:'Quân y',icon:'🩺'}
};
const ALL=[...DATA['Doanh trại'],...DATA['Quân nhu'],...DATA['Quân y']];

let state={};
function goHome(){window.location.href='index.html'}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shuffleOptions(q){
  const correctIndex=LETTERS.indexOf(q.answer);
  const packed=q.options.map((text,i)=>({text,correct:i===correctIndex}));
  const mixed=shuffle(packed);
  return {...q,options:mixed.map(x=>x.text),answer:LETTERS[mixed.findIndex(x=>x.correct)]};
}
function signature(a){return a.map(x=>x.id).join('|')}
function newRandomBank(){
  const key='haucan_last_random_order_v1';
  const prev=localStorage.getItem(key)||'';
  let arr=[];
  for(let t=0;t<20;t++){
    arr=shuffle(ALL);
    if(signature(arr)!==prev)break;
  }
  localStorage.setItem(key,signature(arr));
  return arr.map(shuffleOptions);
}
function historyKey(type){return 'haucan_history_'+type+'_v1'}

function renderHome(type){
  if(type==='random'){
    $('randomSec').innerHTML=homeHTML(type,'Đề ngẫu nhiên',ALL.length,'Toàn bộ câu hỏi của 3 phần được xáo trộn; thứ tự phương án A/B/C/D cũng được đảo ngẫu nhiên, không theo thứ tự trong file Word.');
  }else{
    const x=SECTION_MAP[type], count=DATA[x.key].length;
    $(type+'Sec').innerHTML=homeHTML(type,x.name,count,'Giữ đúng câu hỏi, thứ tự câu và phương án theo phần tương ứng trong file Word. Đáp án đúng lấy từ phương án in màu đỏ.');
  }
  renderHistory(type);
}
function homeHTML(type,title,count,desc){
  const random=type==='random';
  return `<div id="${type}Home" class="bg-white rounded-xl border shadow-sm p-5">
    <h2 class="font-black text-xl mb-1">${random?'🎲':'📘'} ${title}</h2>
    <p class="text-xs sm:text-sm text-slate-500 mb-4">${desc}</p>
    <button onclick="startTest('${type}')" class="w-full p-5 rounded-xl border-2 ${random?'border-indigo-400 bg-indigo-50 text-indigo-900':'border-emerald-400 bg-emerald-50 text-emerald-900'} font-black text-lg">
      ${random?'🎲 TẠO ĐỀ NGẪU NHIÊN MỚI':'▶ BẮT ĐẦU LÀM '+count+' CÂU'}
    </button>
    <div class="mt-4 bg-slate-50 rounded-xl border p-4">
      <div class="flex justify-between mb-2"><b class="text-sm">Lịch sử thi trên thiết bị</b><button onclick="clearHistory('${type}')" class="text-xs text-rose-600 font-bold">Xóa lịch sử</button></div>
      <div id="${type}History" class="space-y-2 max-h-56 overflow-auto"></div>
    </div>
  </div>
  <div id="${type}Active" class="hidden"></div>
  <div id="${type}Result" class="hidden"></div>`;
}

function startTest(type){
  let questions;
  if(type==='random') questions=newRandomBank();
  else questions=DATA[SECTION_MAP[type].key].map(q=>({...q,options:[...q.options]}));
  state[type]={questions,index:0,answers:{},marked:{},checked:{}};
  $(type+'Home').classList.add('hidden');
  $(type+'Result').classList.add('hidden');
  $(type+'Active').classList.remove('hidden');
  renderTest(type);
}
function renderQ(q,chosen,onAnswer,checked=false){
  let h=`<div class="flex justify-between items-center mb-4"><span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-800 font-black text-xs">${esc(q.section)} • Câu ${esc(q.label)}</span></div>
  <div class="text-base sm:text-lg font-bold leading-relaxed text-slate-800 mb-4">${esc(q.q)}</div><div class="space-y-2.5">`;
  q.options.forEach((o,i)=>{
    const L=LETTERS[i], sel=chosen===L;
    let cls=sel?'border-emerald-600 bg-emerald-50 text-emerald-900 ring-2 ring-emerald-500/20':'border-slate-200 bg-white hover:border-emerald-400';
    if(checked){
      if(L===q.answer) cls='border-emerald-600 bg-emerald-50 text-emerald-900 ring-2 ring-emerald-500/20 font-bold';
      else if(sel) cls='border-rose-500 bg-rose-50 text-rose-900 ring-2 ring-rose-400/20 font-bold';
      else cls='border-slate-200 bg-white text-slate-500';
    }
    h+=`<button ${checked?'disabled':''} onclick="${onAnswer}('${L}')" class="opt w-full text-left p-3.5 rounded-xl border-2 flex gap-3 ${cls}"><span class="w-7 h-7 shrink-0 rounded-full border flex items-center justify-center font-bold text-xs">${L}</span><span class="text-sm sm:text-base">${esc(o)}</span></button>`;
  });
  h+='</div>';
  if(checked){
    const ok=chosen===q.answer;
    h+=`<div class="mt-4 p-3 rounded-xl border ${ok?'bg-emerald-50 border-emerald-200 text-emerald-800':'bg-rose-50 border-rose-200 text-rose-800'} font-bold text-sm">
      ${ok?'✅ Chính xác':'❌ Chưa đúng'} • Đáp án đúng: <span class="text-base">${q.answer}</span>
    </div>`;
  }
  return h;
}
function renderTest(type){
  const s=state[type],q=s.questions[s.index],total=s.questions.length;
  $(type+'Active').innerHTML=`<div class="space-y-4">
    <div class="sticky top-[140px] z-10 bg-white rounded-xl border shadow-sm p-3 flex justify-between items-center">
      <div><b>${type==='random'?'Đề ngẫu nhiên':SECTION_MAP[type].name}</b><div class="text-xs text-slate-500">Đã làm: ${Object.keys(s.answers).length}/${total}</div></div>
      <button onclick="submitTest('${type}')" class="bg-emerald-600 text-white px-4 py-2 rounded-lg font-bold text-sm">Nộp bài</button>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      <div class="lg:col-span-3 space-y-4">
        <div class="bg-white rounded-xl border shadow-sm p-4 sm:p-6">${renderQ(q,s.answers[s.index],`answerTest.bind(null,'${type}')`,!!s.checked[s.index])}</div>
        <div class="flex justify-between bg-white p-3 rounded-xl border">
          <button onclick="moveTest('${type}',-1)" class="px-4 py-2 bg-slate-100 rounded-lg font-bold text-sm">← Câu trước</button>
          <div class="flex gap-2">
            <button onclick="markTest('${type}')" class="px-3 py-2 rounded-lg font-bold text-xs ${s.marked[s.index]?'bg-amber-500 text-white':'bg-amber-50 text-amber-800'}">🚩 Đánh dấu</button>
            ${type!=='random'?`<button onclick="checkAnswer('${type}')" class="px-3 py-2 rounded-lg font-bold text-xs ${s.checked[s.index]?'bg-blue-600 text-white':'bg-blue-50 text-blue-700 border border-blue-200'}">✅ Check đáp án</button>`:''}
          </div>
          <button onclick="moveTest('${type}',1)" class="px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold text-sm">Câu tiếp →</button>
        </div>
      </div>
      <aside class="bg-white rounded-xl border shadow-sm p-4 h-fit">
        <div class="font-bold text-sm mb-2">Danh sách câu hỏi</div>
        <div class="grid grid-cols-5 gap-1.5 max-h-[450px] overflow-auto custom-scrollbar">
          ${s.questions.map((x,i)=>{
            let status='bg-slate-100';
            if(s.checked[i]) status=s.answers[i]===x.answer?'bg-emerald-600 text-white border-emerald-600':'bg-rose-500 text-white border-rose-500';
            else if(s.marked[i]) status='bg-amber-100 border-amber-400';
            else if(s.answers[i]) status='bg-blue-500 text-white border-blue-500';
            return `<button onclick="state['${type}'].index=${i};renderTest('${type}')" class="h-9 rounded-lg text-xs font-bold border ${i===s.index?'ring-2 ring-emerald-600 ':''}${status}">${i+1}</button>`;
          }).join('')}
        </div>
      </aside>
    </div>
  </div>`;
}
function answerTest(type,L){
  const s=state[type];
  if(s.checked[s.index]) return;
  s.answers[s.index]=L;
  renderTest(type);
}
function checkAnswer(type){
  if(type==='random') return;
  const s=state[type];
  if(!s.answers[s.index]){
    alert('Bạn hãy chọn một đáp án trước khi kiểm tra.');
    return;
  }
  s.checked[s.index]=true;
  renderTest(type);
}
function moveTest(type,d){let s=state[type];s.index=Math.max(0,Math.min(s.questions.length-1,s.index+d));renderTest(type)}
function markTest(type){let s=state[type];s.marked[s.index]=!s.marked[s.index];renderTest(type)}

function reviewHTML(qs,answers){
 return qs.map((q,i)=>`<div class="p-4 rounded-xl border ${answers[i]===q.answer?'bg-emerald-50 border-emerald-200':'bg-rose-50 border-rose-200'}">
   <div class="font-bold mb-2">Câu ${i+1} • ${esc(q.section)} • Nguồn câu ${esc(q.label)} • ${answers[i]===q.answer?'✅ Đúng':'❌ Sai'}</div>
   <div class="font-bold mb-2">${esc(q.q)}</div>
   <div class="space-y-1 text-sm">${q.options.map((o,j)=>`<div class="${LETTERS[j]===q.answer?'font-bold text-emerald-800':''}">${LETTERS[j]}. ${esc(o)}</div>`).join('')}</div>
   <div class="mt-2 text-sm"><b>Bạn chọn:</b> ${answers[i]||'Chưa chọn'} &nbsp; • &nbsp; <b>Đáp án:</b> ${q.answer}</div>
 </div>`).join('');
}
function submitTest(type){
  const s=state[type], total=s.questions.length;
  if(!confirm(`Nộp bài? Đã làm ${Object.keys(s.answers).length}/${total} câu.`))return;
  const correct=s.questions.filter((q,i)=>s.answers[i]===q.answer).length;
  const percent=Math.round(correct/total*100);
  saveHistory(type,correct,total,percent);
  $(type+'Active').classList.add('hidden');
  const r=$(type+'Result'); r.className='bg-white rounded-xl border shadow-sm p-6'; r.classList.remove('hidden');
  r.innerHTML=`<div class="text-center border-b pb-5">
      <div class="text-4xl">🏆</div><h2 class="font-black text-2xl">KẾT QUẢ</h2>
      <div class="mt-3"><span class="text-3xl font-black text-emerald-600">${correct}/${total}</span><span class="ml-4 text-2xl font-black text-amber-500">${percent}%</span></div>
    </div>
    <div class="space-y-4 mt-5">${reviewHTML(s.questions,s.answers)}</div>
    <div class="text-center mt-5"><button onclick="newTest('${type}')" class="px-6 py-3 bg-emerald-600 text-white rounded-xl font-bold">${type==='random'?'🎲 Tạo đề ngẫu nhiên mới':'Làm lại đề'}</button></div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function newTest(type){
  $(type+'Result').classList.add('hidden');
  $(type+'Home').classList.remove('hidden');
  startTest(type);
}
function saveHistory(type,score,total,percent){
  const key=historyKey(type);
  let h=JSON.parse(localStorage.getItem(key)||'[]');
  h.unshift({date:new Date().toLocaleString('vi-VN'),score,total,percent});
  localStorage.setItem(key,JSON.stringify(h.slice(0,50)));
  renderHistory(type);
}
function renderHistory(type){
  const el=$(type+'History'); if(!el)return;
  const h=JSON.parse(localStorage.getItem(historyKey(type))||'[]');
  el.innerHTML=h.length?h.map(x=>`<div class="bg-white border rounded-lg p-2 text-xs flex justify-between gap-2"><span>${x.date}</span><b class="text-emerald-700">${x.score}/${x.total} • ${x.percent}%</b></div>`).join(''):'<div class="text-xs text-slate-400">Chưa có lượt thi nào.</div>';
}
function clearHistory(type){
  if(confirm('Xóa lịch sử của phần này?')){localStorage.removeItem(historyKey(type));renderHistory(type)}
}
function switchTab(type){
  ['doanh','nhu','y','random'].forEach(x=>$(x+'Sec').classList.toggle('hidden',x!==type));
  const tabs={doanh:'tabDoanh',nhu:'tabNhu',y:'tabY',random:'tabRandom'};
  Object.entries(tabs).forEach(([k,id])=>$(id).className='tabbtn py-3 px-4 font-bold text-sm border-b-2 '+(k===type?'border-emerald-600 text-emerald-700':'border-transparent text-slate-500'));
  renderHistory(type);
}
window.onload=()=>{
  ['doanh','nhu','y','random'].forEach(renderHome);
};
</script>
</body>
</html>
